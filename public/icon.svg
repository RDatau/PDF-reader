<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="4" />

  <!-- Document Sheet -->
  <g transform="translate(106, 86)">
    <!-- Back page shadow/layer -->
    <rect x="24" y="20" width="250" height="320" rx="20" fill="#1E293B" opacity="0.6" />

    <!-- Main PDF Page -->
    <rect x="0" y="0" width="260" height="340" rx="24" fill="#0F172A" stroke="#334155" stroke-width="6" />

    <!-- Red/Blue PDF Accent Badge -->
    <rect x="32" y="32" width="70" height="28" rx="6" fill="#EF4444" />
    <text x="67" y="51" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">PDF</text>

    <!-- Document Lines -->
    <rect x="32" y="84" width="196" height="10" rx="5" fill="#94A3B8" />
    <rect x="32" y="112" width="160" height="10" rx="5" fill="#64748B" />
    <rect x="32" y="140" width="180" height="10" rx="5" fill="#64748B" />
    <rect x="32" y="168" width="130" height="10" rx="5" fill="#475569" />

    <!-- Audio / Voice Wave Motif -->
    <g transform="translate(32, 215)">
      <!-- Wave bars -->
      <rect x="0" y="30" width="10" height="40" rx="5" fill="url(#cyanGrad)" />
      <rect x="18" y="12" width="10" height="76" rx="5" fill="url(#blueGrad)" />
      <rect x="36" y="0" width="10" height="100" rx="5" fill="url(#cyanGrad)" />
      <rect x="54" y="18" width="10" height="64" rx="5" fill="url(#blueGrad)" />
      <rect x="72" y="34" width="10" height="32" rx="5" fill="url(#cyanGrad)" />
      
      <!-- Microphone / Voice Circle -->
      <circle cx="150" cy="50" r="38" fill="url(#blueGrad)" filter="url(#glow)" />
      <path d="M150 30 C144 30 139 35 139 41 L139 52 C139 58 144 63 150 63 C156 63 161 58 161 52 L161 41 C161 35 156 30 150 30 Z" fill="#FFFFFF" />
      <path d="M133 49 C133 58 140 66 150 66 C160 66 167 58 167 49" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      <line x1="150" y1="66" x2="150" y2="74" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
      <line x1="142" y1="74" x2="158" y2="74" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
